<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8F7F4" />
      <stop offset="100%" stop-color="#EFEAE2" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#aboutLightBg)" />

  <!-- Strategic Advisory Geometric Backdrop -->
  <g opacity="0.45" stroke="#E7E1D8" stroke-width="1.5" fill="none">
    <circle cx="400" cy="400" r="160" />
    <circle cx="400" cy="400" r="280" />
    <circle cx="400" cy="400" r="380" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="400" y1="0" x2="400" y2="800" />
  </g>

  <!-- Advisory Silhouette -->
  <g transform="translate(0, 70)">
    <path d="M 240 920 C 260 690 320 640 400 640 C 480 640 540 690 560 920 Z" fill="#2E2E2E" stroke="#E7E1D8" stroke-width="1.5" />
    <rect x="360" y="500" width="80" height="80" rx="14" fill="#D9CFC4" />
    <ellipse cx="400" cy="400" rx="95" ry="125" fill="#E7DDD2" stroke="rgba(196,123,69,0.35)" stroke-width="2" />
    <path d="M 310 360 Q 320 260 400 260 Q 480 260 490 360 Q 470 320 400 320 Q 330 320 310 360 Z" fill="#252525" />
    <!-- Glasses -->
    <rect x="335" y="380" width="50" height="30" rx="6" fill="none" stroke="#C47B45" stroke-width="2.5" />
    <rect x="415" y="380" width="50" height="30" rx="6" fill="none" stroke="#C47B45" stroke-width="2.5" />
    <line x1="385" y1="395" x2="415" y2="395" stroke="#C47B45" stroke-width="2.5" />
  </g>

  <!-- Modern Overlay Badge (Pure White) -->
  <g transform="translate(440, 740)">
    <rect width="290" height="130" rx="14" fill="#FFFFFF" stroke="#E7E1D8" stroke-width="1.5" />
    <text x="28" y="44" fill="#686868" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">STRATEGIC DISCIPLINE</text>
    <text x="28" y="78" fill="#252525" font-family="Manrope, sans-serif" font-size="20" font-weight="700">Digital Growth Advisory</text>
    <text x="28" y="104" fill="#C47B45" font-family="Inter, sans-serif" font-size="13" font-weight="600">Marketing Strategy &amp; Execution</text>
  </g>
