<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8F7F4" />
      <stop offset="100%" stop-color="#EFEAE2" />
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C47B45" />
      <stop offset="100%" stop-color="#D9A77C" />
    </linearGradient>
    <linearGradient id="suitLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D3D3D" />
      <stop offset="100%" stop-color="#252525" />
    </linearGradient>
    <radialGradient id="warmRim" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#D9A77C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D9A77C" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#heroBg)" />

  <!-- Studio Ambient Light -->
  <circle cx="640" cy="280" r="260" fill="url(#warmRim)" filter="url(#softGlow)" />
  <circle cx="160" cy="720" r="220" fill="#EFEAE2" filter="url(#softGlow)" />

  <!-- Minimal Grid lines -->
  <g stroke="#E7E1D8" stroke-width="1" opacity="0.6">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="200" y1="0" x2="200" y2="1000" />
    <line x1="400" y1="0" x2="400" y2="1000" />
    <line x1="600" y1="0" x2="600" y2="1000" />
  </g>

  <!-- Silhouette & Professional Consultant Figure -->
  <g transform="translate(0, 40)">
    <!-- Jacket / Torso -->
    <path d="M 220 960 Q 240 680 320 620 L 480 620 Q 560 680 580 960 Z" fill="url(#suitLight)" stroke="#E7E1D8" stroke-width="1.5" />

    <!-- Jacket Collar & Lapels -->
    <path d="M 320 620 L 370 790 L 400 960 L 430 790 L 480 620 L 430 630 L 400 700 L 370 630 Z" fill="#2D2D2D" stroke="rgba(196, 123, 69, 0.4)" stroke-width="1.5" />

    <!-- Shirt / Tie -->
    <path d="M 370 630 L 430 630 L 415 720 L 400 760 L 385 720 Z" fill="#FFFFFF" />
    <path d="M 395 645 L 405 645 L 410 740 L 400 760 L 390 740 Z" fill="#C47B45" />

    <!-- Neck -->
    <rect x="365" y="470" width="70" height="90" rx="16" fill="#D9CFC4" />

    <!-- Head Outline -->
    <ellipse cx="400" cy="380" rx="95" ry="120" fill="#E7DDD2" stroke="rgba(196, 123, 69, 0.4)" stroke-width="2" />

    <!-- Hair & Beard Styling Silhouette -->
    <path d="M 305 340 Q 310 240 400 240 Q 490 240 495 340 Q 480 300 400 300 Q 320 300 305 340 Z" fill="#252525" />
    <path d="M 320 420 Q 400 520 480 420 Q 485 470 450 510 Q 400 540 350 510 Q 315 470 320 420 Z" fill="#333333" />

    <!-- Glasses / Precision Focus Graphic Accent -->
    <rect x="330" y="360" width="55" height="32" rx="8" fill="none" stroke="#C47B45" stroke-width="3" />
    <rect x="415" y="360" width="55" height="32" rx="8" fill="none" stroke="#C47B45" stroke-width="3" />
    <line x1="385" y1="375" x2="415" y2="375" stroke="#C47B45" stroke-width="3" />

    <!-- Subtle Lighting Accent -->
    <path d="M 460 340 Q 480 380 470 420" stroke="url(#terracottaGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Growth Graphic Floating Interface Overlay (White & Terracotta) -->
  <g transform="translate(60, 680)">
    <rect width="280" height="110" rx="14" fill="#FFFFFF" stroke="#E7E1D8" stroke-width="1.5" />
    <text x="24" y="38" fill="#686868" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CONVERSION GROWTH RATE</text>
    <text x="24" y="74" fill="#252525" font-family="Manrope, sans-serif" font-size="28" font-weight="800">+284%</text>
    <polyline points="180,78 205,62 225,68 255,42" fill="none" stroke="#C47B45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="255" cy="42" r="4" fill="#C47B45" />
  </g>
</svg>
