<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="g1Light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8F7F4" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#g1Light)" stroke="#E7E1D8" stroke-width="1" />
  <circle cx="500" cy="80" r="140" fill="#EFEAE2" />
  <!-- Data Graph Visual -->
  <g transform="translate(60, 60)" stroke="#C47B45" stroke-width="2" fill="none">
    <rect x="0" y="0" width="480" height="260" rx="14" stroke="#E7E1D8" fill="#FFFFFF" />
    <!-- Grid -->
    <line x1="40" y1="210" x2="440" y2="210" stroke="#E7E1D8" />
    <line x1="40" y1="150" x2="440" y2="150" stroke="#E7E1D8" />
    <line x1="40" y1="90" x2="440" y2="90" stroke="#E7E1D8" />
    <!-- Bars -->
    <rect x="70" y="140" width="36" height="70" rx="4" fill="#EFEAE2" stroke="none" />
    <rect x="140" y="110" width="36" height="100" rx="4" fill="#D9CFC4" stroke="none" />
    <rect x="210" y="80" width="36" height="130" rx="4" fill="#D9A77C" opacity="0.6" stroke="none" />
    <rect x="280" y="60" width="36" height="150" rx="4" fill="#C47B45" opacity="0.8" stroke="none" />
    <rect x="350" y="40" width="36" height="170" rx="4" fill="#C47B45" stroke="none" />
    <!-- Trend Line -->
    <path d="M 88 130 Q 200 90 368 35" stroke="#C47B45" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="368" cy="35" r="5" fill="#C47B45" />
  </g>
</svg>
